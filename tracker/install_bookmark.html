<h2>Install the copy button</h2>
<ol><li>Show your bookmarks bar: <b>⌘⇧B</b> (Chrome) or <b>View → Show Favorites Bar</b> (Safari).</li>
<li>Drag this button onto the bookmarks bar:<br><br>
<a href="javascript:(()%20=>%20{%0A%20%20const%20y%20=%20(location.pathname.match(/year%5C/(%5Cd{4})/)%20||%20[])[1];%0A%20%20if%20(!location.hostname.endsWith('boxofficemojo.com')%20||%20!y)%20{%20alert('Open%20a%20boxofficemojo.com/year/YYYY/%20page%20first.');%20return;%20}%0A%20%20const%20t%20=%20[...document.querySelectorAll('table')].sort((a,%20b)%20=>%20b.rows.length%20-%20a.rows.length)[0];%0A%20%20if%20(!t)%20{%20alert('No%20table%20found%20on%20this%20page.');%20return;%20}%0A%20%20const%20rows%20=%20[...t.rows].map(r%20=>%20[...r.cells].map(c%20=>%20c.innerText.trim().replace(/%5Cs+/g,%20'%20')).join('%5Ct'));%0A%20%20const%20ti%20=%20rows[0].split('%5Ct').indexOf('Theaters');%0A%20%20if%20(ti%20%3C%200)%20{%20alert('Could%20not%20find%20the%20Theaters%20column.');%20return;%20}%0A%20%20const%20th%20=%20rows.slice(1).map(r%20=>%20parseInt((r.split('%5Ct')[ti]%20||%20'').replace(/%5CD/g,%20''))%20||%200);%0A%20%20if%20(!th.every((v,%20i)%20=>%20i%20===%200%20||%20v%20%3C=%20th[i%20-%201]))%20{%0A%20%20%20%20alert('Sort%20by%20theaters%20first:%20click%20the%20%22Theaters%22%20column%20header%20(largest%20first),%20then%20click%20this%20button%20again.');%20return;%0A%20%20}%0A%20%20const%20smallest%20=%20th[th.length%20-%201];%0A%20%20navigator.clipboard.writeText('%23BOM_YEAR%20'%20+%20y%20+%20'%5Cn'%20+%20rows.join('%5Cn')).then(%0A%20%20%20%20()%20=>%20alert(%60Copied%20%24{y}:%20%24{rows.length%20-%201}%20films.%20Smallest%20theater%20count%20on%20page:%20%24{smallest}.%60%20+%0A%20%20%20%20%20%20(smallest%20>=%20600%20?%20'%5Cn%5CnWARNING:%20still%20600+,%20so%20some%20wide%20releases%20may%20be%20cut%20off.%20Tell%20Claude.'%20:%20'%5Cn%5CnOK:%20every%20wide%20release%20is%20included.')),%0A%20%20%20%20e%20=>%20alert('Copy%20failed:%20'%20+%20e));%0A})();" style="display:inline-block;padding:10px 18px;background:#FF5B1F;color:#fff;border-radius:8px;text-decoration:none;font-weight:600">Copy BOM table</a></li>
